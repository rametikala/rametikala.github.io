<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="util"><div class="w"><span>Portfolio of Sairam Etiakla, technical product manager</span><span><a href="https://github.com/rametikala">GitHub</a><a href="mailto:sairam.etikala.75@gmail.com">Email</a></span></div></div>
<header class="w"><div class="mast"><a class="logo" href="index.html"><i>/</i>Field Notes</a><span class="tag-line">Hardware projects</span></div></header>
<main><article class="post" id="post"></article></main>
<footer><div class="w"><a href="index.html">Back to all projects</a></div></footer>
<script src="projects.js"></script>
<script>
const slug=location.hash.slice(1);
const p=PROJECTS.find(x=>x.slug===slug)||PROJECTS[0];
document.title=p.title+" | Field Notes";
const rows=p.stats.map(s=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td><td>${esc(s[2])}</td><td class="st${/flown|data|run|Open/i.test(s[3])?"":" ok"}">${esc(s[3])}</td></tr>`).join("");
document.getElementById("post").innerHTML=`${chips(p)}<h1>${esc(p.title)}</h1><p class="dek">${esc(p.dek)}</p>
<div class="by"><span>By <strong>YOUR NAME</strong></span><span>${fmt(p.date)}</span><span>${esc(p.read)}</span><span>Status: <strong>${esc(p.status)}</strong></span></div>
<figure><div class="art"><b>${esc(p.status)}</b></div><figcaption>${esc(p.caption)}</figcaption></figure>
<div class="body">${p.sections.map((s,i)=>`<h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>${i===1?`<div class="facts"><h3>By the numbers</h3><div class="t"><table><thead><tr><th>Metric</th><th>Target</th><th>Measured</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`:""}`).join("")}</div>
<div class="facts"><h3>Evidence</h3><ul class="links">${p.links.map(l=>`<li><a href="${esc(l[1])}">${esc(l[0])}</a></li>`).join("")}</ul></div>
<div class="more"><h3>More projects</h3><div class="list">${PROJECTS.filter(x=>x!==p).map(x=>`<article>${chips(x)}<h3><a href="${href(x)}">${esc(x.title)}</a></h3></article>`).join("")}</div></div>`;
window.addEventListener("hashchange",()=>location.reload());
</script></body></html>
