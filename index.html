<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sairam Etikala | Technical product manager</title>
<meta name="description" content="Technical product manager portfolio: aircraft, spacecraft and field hardware projects, with notes on what I learn.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2430;--muted:#5c6877;--rule:#e3e7ec;--bg:#fff;--chip:#eff3f9;--blue:#1d4ed8;--warn:#9a5b00;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.6 "Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:var(--blue)}a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--rule)}header .w{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:16px;padding-bottom:16px}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.01em}.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:6px}nav a{padding:6px 14px;border-radius:999px;font-weight:600;font-size:.95rem}nav a:hover{background:var(--chip);color:var(--ink)}nav a.on{background:var(--ink);color:#fff}
.hero{padding:48px 0 12px}.hero p.hi{margin:0 0 6px;color:var(--muted);font-weight:600}.hero h1{font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.1;letter-spacing:-.02em;font-weight:800;margin:0 0 12px;max-width:22ch}
.lede{font-size:1.15rem;color:var(--muted);max-width:60ch;margin:0}
h2.sec{font-size:1.35rem;font-weight:800;margin:36px 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;padding-bottom:56px}
.card{display:block;border:1px solid var(--rule);border-radius:8px;padding:18px;background:#fff;transition:box-shadow .15s,border-color .15s}
a.card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(27,36,48,.08);color:inherit}
.card.off{background:#fafbfc;color:var(--muted)}
.thumb{width:calc(100% + 36px);margin:-18px -18px 14px;border-radius:8px 8px 0 0;aspect-ratio:16/9;object-fit:cover;display:block}
.card h3{font-size:1.2rem;line-height:1.25;margin:8px 0 6px;font-weight:700}.card p{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--chip);padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;color:var(--muted)}.chip.k{background:var(--blue);color:#fff}
.meta{color:var(--muted);font-size:.85rem}.st{font-weight:700;color:var(--warn)}
.post{max-width:740px;margin:0 auto;padding:36px 0 60px}.post h1{font-size:clamp(1.9rem,4.5vw,2.8rem);line-height:1.1;letter-spacing:-.02em;font-weight:800;margin:12px 0 10px}
.dek{font-size:1.2rem;line-height:1.4;color:var(--muted);margin:0 0 14px}
.by{display:flex;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:.9rem;margin-bottom:24px;color:var(--muted)}.by strong{color:var(--ink)}
.body{font:400 1.12rem/1.75 "Source Serif 4",Georgia,serif}.body h2{font:800 1.45rem/1.25 "Archivo",system-ui,sans-serif;margin:32px 0 8px}.body h3{font:700 1.15rem/1.25 "Archivo",system-ui,sans-serif;margin:24px 0 6px}
.body img{max-width:100%;height:auto}.body a{color:var(--blue);text-decoration:underline}.body table{width:100%;border-collapse:collapse;font:400 .95rem/1.4 "Archivo",system-ui,sans-serif;display:block;overflow-x:auto}
.body th,.body td{text-align:left;padding:8px;border-bottom:1px solid var(--rule)}.body pre{overflow-x:auto;background:var(--chip);padding:12px;border-radius:6px;font-size:.9rem}.body code{font-size:.9em}
.body blockquote{margin:0 0 1em;padding-left:16px;border-left:4px solid var(--blue);color:var(--muted)}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:9px 18px;font-weight:700;font-size:.9rem;border-radius:999px}.btn:hover{background:var(--blue);color:#fff}
.note{color:var(--muted);max-width:62ch}
footer{border-top:1px solid var(--rule);padding:24px 0 44px;color:var(--muted);font-size:.9rem}footer .w{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}footer a{margin-left:16px}footer a:first-child{margin-left:0}footer a:hover{color:var(--blue)}
</style></head><body>
<header><div class="w"><a class="brand" href="#/"><span id="brand"></span><small>Technical product manager</small></a>
<nav aria-label="Main"><a href="#/" data-r="home">Home</a><a href="#/projects" data-r="projects">Projects</a><a href="#/about" data-r="about">About</a></nav></div></header>
<main class="w" id="app">Loading...</main>
<footer><div class="w"><span id="foot"></span><span id="links"></span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
/* ===== EDIT THIS BLOCK ===== */
const CFG = {
  owner: "rametikala",
  branch: "main",
  name: "Sairam Etikala",
  headline: "Technical product manager for aircraft and spacecraft.",
  intro: "I build products from user need to deployment, and I want them to reach as many people as possible.",
  email: "sairam.etikala.75@gmail.com",
  linkedin: "https://www.linkedin.com/in/sairam-etikala-hyd/",
  file: "page.md", // the markdown file the site reads from every repo
  siteRepo: "rametikala.github.io", // this website's repo: its page.md is the About page, its blogs/ folder holds posts
  projects: ["WaterDischargeLogger", "MapGenerator"] // one project repo per name; add a name only when that repo has a page.md
};
/* ===== END ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RAW=(r,p)=>`https://raw.githubusercontent.com/${CFG.owner}/${r}/${CFG.branch}/${p}`;
$("brand").textContent=CFG.name;document.title=CFG.name+" | Technical product manager";
$("foot").textContent="© "+new Date().getFullYear()+" "+CFG.name;
$("links").innerHTML=`<a href="https://github.com/${CFG.owner}">GitHub</a><a href="${esc(CFG.linkedin)}">LinkedIn</a><a href="mailto:${esc(CFG.email)}">Email</a>`;
const cache={};
function parse(kind,repo,dir,id,md){
 const m=md.match(/<!--\s*portfolio([\s\S]*?)-->/i),meta={};
 if(m)m[1].split("\n").forEach(l=>{const i=l.indexOf(":");if(i>0)meta[l.slice(0,i).trim().toLowerCase()]=l.slice(i+1).trim()});
 const body=md.replace(/<!--[\s\S]*?-->/g,"");const toks=marked.lexer(body);
 const h1=toks.find(t=>t.type==="heading"&&t.depth===1),p=toks.find(t=>t.type==="paragraph");
 const fd=(id.match(/^(\d{4}-\d{2}-\d{2})/)||[])[1]||"";
 const fallback=id.replace(/\.md$/i,"").replace(/^\d{4}-\d{2}-\d{2}-?/,"").replace(/[-_]+/g," ");
 return{kind,repo,dir,id,title:meta.title||(h1?h1.text:fallback||repo),dek:meta.dek||(p?p.text.slice(0,180):""),
  topics:(meta.topics||"").split(",").map(s=>s.trim()).filter(Boolean),status:meta.status||"",date:meta.date||fd,
  image:meta.image||"",body:h1?body.replace(h1.raw,""):body}}
async function getMd(repo,path){const r=await fetch(RAW(repo,path));if(!r.ok)throw 0;return r.text()}
async function loadProject(repo){
 if(cache["p:"+repo])return cache["p:"+repo];
 try{return cache["p:"+repo]=parse("project",repo,"",repo,await getMd(repo,CFG.file))}
 catch(e){return cache["p:"+repo]={kind:"project",repo,id:repo,title:repo,dek:CFG.file+" not found, or the repository is private.",topics:[],status:"",date:"",missing:true}}}
async function loadBlog(name){
 if(cache["b:"+name])return cache["b:"+name];
 try{return cache["b:"+name]=parse("blog",CFG.siteRepo,"blogs",name,await getMd(CFG.siteRepo,"blogs/"+name))}catch(e){return null}}
async function listBlogs(){
 const k="blogs:"+CFG.siteRepo;
 try{const c=sessionStorage.getItem(k);if(c)return JSON.parse(c)}catch(e){}
 const ok=n=>/\.md$/i.test(n)&&!/^readme\.md$/i.test(n);let names=null;
 try{const r=await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.siteRepo}/contents/blogs?ref=${CFG.branch}`);
  if(r.ok)names=(await r.json()).filter(f=>f.type==="file").map(f=>f.name).filter(ok);else if(r.status===404)names=[]}catch(e){}
 if(names===null)try{const r=await fetch(`https://data.jsdelivr.com/v1/packages/gh/${CFG.owner}/${CFG.siteRepo}@${CFG.branch}?structure=flat`);
  if(r.ok)names=((await r.json()).files||[]).map(f=>f.name).filter(n=>/^\/blogs\/[^/]+$/.test(n)).map(n=>n.slice(7)).filter(ok)}catch(e){}
 if(names===null)return[];try{sessionStorage.setItem(k,JSON.stringify(names))}catch(e){}return names}
const loadAll=async()=>{const [ps,names]=await Promise.all([Promise.all(CFG.projects.map(loadProject)),listBlogs()]);
 const bs=(await Promise.all(names.map(loadBlog))).filter(Boolean);return{ps,bs}};
const byDate=(a,b)=>b.date.localeCompare(a.date);
const href=p=>p.kind==="blog"?`#/b/${encodeURIComponent(p.id)}`:`#/p/${encodeURIComponent(p.repo)}`;
const imgUrl=p=>/^https?:/.test(p.image)?p.image:RAW(p.repo,(p.dir?p.dir+"/":"")+p.image.replace(/^\.?\//,""));
function card(p){
 const inner=`${p.image?`<img class="thumb" src="${esc(imgUrl(p))}" alt="">`:""}<div class="chips"><span class="chip k">${p.kind==="blog"?"Blog":"Project"}</span>${p.topics.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div><h3>${esc(p.title)}</h3><p>${esc(p.dek)}</p><div class="meta">${[p.date?esc(p.date):"",p.status?`<span class="st">${esc(p.status)}</span>`:""].filter(Boolean).join(" · ")}</div>`;
 return p.missing?`<div class="card off">${inner}</div>`:`<a class="card" href="${href(p)}">${inner}</a>`}
async function home(){
 const {ps,bs}=await loadAll();const all=[...ps,...bs].sort(byDate);
 $("app").innerHTML=`<section class="hero"><p class="hi">Hello, I'm ${esc(CFG.name)}.</p><h1>${esc(CFG.headline)}</h1><p class="lede">${esc(CFG.intro)}</p></section>
 <h2 class="sec">Latest projects and posts</h2><div class="cards">${all.map(card).join("")}</div>`}
async function projects(){
 const {ps}=await loadAll();
 $("app").innerHTML=`<section class="hero"><h1>Projects</h1><p class="lede">Each project holds the requirements, decisions, tests and costs.</p></section><h2 class="sec">All projects</h2><div class="cards">${ps.sort(byDate).map(card).join("")}</div>`}
function article(p,foot,plain){
 const d=document.createElement("div");d.innerHTML=DOMPurify.sanitize(marked.parse(p.body));
 const base=(p.dir?p.dir+"/":"");
 d.querySelectorAll("img").forEach(i=>{const s=i.getAttribute("src")||"";if(!/^(https?:|data:)/.test(s))i.src=RAW(p.repo,base+s.replace(/^\.?\//,""))});
 d.querySelectorAll("a").forEach(a=>{const h=a.getAttribute("href")||"";if(h.startsWith("#"))a.removeAttribute("href");else if(!/^(https?:|mailto:)/.test(h))a.href=`https://github.com/${CFG.owner}/${p.repo}/blob/${CFG.branch}/${base}${h.replace(/^\.?\//,"")}`;a.rel="noopener"});
 return`<article class="post"><div class="chips"><span class="chip k">${esc(p.kind==="blog"?"Blog":p.kind==="project"?"Project":"About")}</span>${p.topics.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div><h1>${esc(p.title)}</h1>${plain?"":`<p class="dek">${esc(p.dek)}</p>`}
 ${plain?"":`<div class="by"><span>By <strong>${esc(CFG.name)}</strong></span>${p.date?`<span>${esc(p.date)}</span>`:""}${p.status?`<span>Status: <strong class="st">${esc(p.status)}</strong></span>`:""}</div>`}<div class="body">${d.innerHTML}</div><p style="margin-top:32px">${foot}</p></article>`}
async function project(repo){const p=await loadProject(repo);$("app").innerHTML=p.missing?`<p class="note">${esc(p.dek)}</p>`:article(p,`<a class="btn" href="https://github.com/${CFG.owner}/${esc(repo)}">View repository ↗</a>`)}
async function blog(name){const p=await loadBlog(name);$("app").innerHTML=p?article(p,`<a class="btn" href="#/">Back to home</a>`):`<p class="note">That post was not found.</p>`}
async function about(){try{const p=parse("about",CFG.siteRepo,"",CFG.file,await getMd(CFG.siteRepo,CFG.file));p.topics=[];$("app").innerHTML=article(p,`<a class="btn" href="mailto:${esc(CFG.email)}">Get in touch</a>`,true)}catch(e){$("app").innerHTML=`<p class="note">Add a ${esc(CFG.file)} to the ${esc(CFG.siteRepo)} repository.</p>`}}
async function route(){
 const h=location.hash.replace(/^#\/?/,"").split("/"),a=decodeURIComponent(h[1]||"");
 let r="home",fn=home;
 if(h[0]==="projects"){r="projects";fn=projects}
 else if(h[0]==="p"&&CFG.projects.includes(a)){r="projects";fn=()=>project(a)}
 else if(h[0]==="b"&&/^[\w.\-]+\.md$/i.test(a)){r="home";fn=()=>blog(a)}
 else if(h[0]==="about"){r="about";fn=about}
 document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.r===r));
 $("app").innerHTML="Loading...";scrollTo(0,0);
 try{await fn()}catch(e){$("app").textContent="Could not load content. Check the config block and the page.md files."}}
addEventListener("hashchange",route);route();
</script></body></html>
